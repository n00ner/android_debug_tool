[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apkdbg"
version = "0.1.0"
description = "Programmatic APK debugging & reverse-engineering backend for LLM agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
apkdbg = "apkdbg.cli:main"

[tool.setuptools.packages.find]
include = ["apkdbg*"]
